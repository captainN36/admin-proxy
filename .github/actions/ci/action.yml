name: admin CI
description: Install dependencies and lint (Next.js admin). Docker deploy runs from infra when configured.

inputs:
  source_dir:
    description: App root path relative to repository root
    required: false
    default: .

runs:
  using: composite
  steps:
    - uses: pnpm/action-setup@v4
      with:
        package_json_file: ${{ inputs.source_dir }}/package.json

    - uses: actions/setup-node@v4
      with:
        node-version: 20
        cache: pnpm
        cache-dependency-path: ${{ inputs.source_dir }}/pnpm-lock.yaml

    - name: Install
      shell: bash
      working-directory: ${{ inputs.source_dir }}
      env:
        HUSKY: "0"
      run: pnpm install --frozen-lockfile

    - name: Lint
      shell: bash
      working-directory: ${{ inputs.source_dir }}
      run: pnpm run lint
